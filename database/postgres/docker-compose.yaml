version: '3.3'

services:
  postgres:
    image: postgres:14.5
    container_name: pg
    # hostname: localhost
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

networks:
    app_network:
        external: true
